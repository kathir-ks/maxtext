# Model config for MiniMax-M2.7 (230B total, 10B active)
# See https://huggingface.co/MiniMaxAI/MiniMax-M2.7 for the reference HF config.

# Core architecture
decoder_block: "minimax_m2"
base_emb_dim: 3072
base_num_query_heads: 48
base_num_kv_heads: 8
head_dim: 128
base_num_decoder_layers: 62
mlp_activations: ["silu", "linear"]
vocab_size: 200064
normalization_layer_epsilon: 1.0e-6
use_qk_norm: True
logits_via_embedding: False        # tie_word_embeddings=False

# MoE — sparse, sigmoid-routed with learnable routing bias
num_experts: 256
num_experts_per_tok: 8
base_moe_mlp_dim: 1536              # intermediate_size in HF config
shared_experts: 0                   # shared_intermediate_size=0
first_num_dense_layers: 0           # all 62 layers are MoE
routed_score_func: "sigmoid"        # sigmoid scoring per expert
routed_bias: True                   # e_score_correction_bias (learnable)
routed_scaling_factor: 1.0
norm_topk_prob: False               # no top-k probability normalization

# RoPE — partial rotary (rotary_dim=64 of head_dim=128)
rope_max_timescale: 5_000_000       # rope_theta
partial_rotary_factor: 0.5          # rotary_dim / head_dim = 64 / 128
max_position_embeddings: 196608

# MTP — disabled for inference. Training would set mtp_num_layers: 3.
mtp_num_layers: 0

# General
enable_dropout: False
