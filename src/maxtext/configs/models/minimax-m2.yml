# Model config for MiniMax-M2 (230B total, 10B active)
# See https://huggingface.co/MiniMaxAI/MiniMax-M2 for the reference HF config.
# Architecturally identical to M2.7 modulo the max-position window.

decoder_block: "minimax_m2"
base_emb_dim: 3072
base_num_query_heads: 48
base_num_kv_heads: 8
head_dim: 128
base_num_decoder_layers: 62
mlp_activations: ["silu", "linear"]
vocab_size: 200064
normalization_layer_epsilon: 1.0e-6
use_qk_norm: True
logits_via_embedding: False

num_experts: 256
num_experts_per_tok: 8
base_moe_mlp_dim: 1536
shared_experts: 0
first_num_dense_layers: 0
routed_score_func: "sigmoid"
routed_bias: True
routed_scaling_factor: 1.0
norm_topk_prob: False

rope_max_timescale: 5_000_000
partial_rotary_factor: 0.5
max_position_embeddings: 204800

mtp_num_layers: 0

enable_dropout: False
